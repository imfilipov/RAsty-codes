[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-reconcile"
version = "0.2.0"
description = "Python wrapper for the optimized Rust RA-LDPC reconciliation CLI"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

